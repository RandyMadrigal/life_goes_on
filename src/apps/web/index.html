<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Goes On</title>
    <meta
      name="description"
      content="Life Goes On — a quiet daily letter of motivational words, delivered every morning. Browse quotes by mood or subscribe to receive one in your inbox."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Life Goes On" />
    <meta property="og:title" content="Life Goes On" />
    <meta
      property="og:description"
      content="A quiet daily letter of motivational words, delivered every morning."
    />
    <meta property="og:image" content="https://www.dailyinochi.com/og-image.jpg" />
    <meta property="og:url" content="https://www.dailyinochi.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Life Goes On" />
    <meta
      name="twitter:description"
      content="A quiet daily letter of motivational words, delivered every morning."
    />
    <meta name="twitter:image" content="https://www.dailyinochi.com/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          document.documentElement.classList.toggle("dark", t !== "light");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
